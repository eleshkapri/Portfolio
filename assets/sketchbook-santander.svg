  <text x="175" y="105" fill="#0284c7" font-family="'Caveat', cursive" font-size="15">→ Atomic buttons</text>
  <text x="175" y="130" fill="#0284c7" font-family="'Caveat', cursive" font-size="15">→ Tokenized colors</text>
